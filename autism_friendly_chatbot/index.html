<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autism Friendly Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="character-container"><!-- Lottie animation will appear here --></div>
    <div id="chat-container"></div>
    <div id="mic-indicator" title="Listening..."></div>
    <div style="margin-top:24px; width:100%; display:flex; gap:8px;">
      <input id="sim-input" type="text" placeholder="Type here to simulate speaking..." style="flex:1; padding:8px; border-radius:8px; border:1px solid #ccc; font-size:1em;" />
      <button id="sim-send" style="padding:8px 16px; border-radius:8px; background:#b2dfdb; border:none; font-size:1em;">Send</button>
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
